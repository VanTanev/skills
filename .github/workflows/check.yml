name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck -x --enable=check-extra-masked-returns -- scripts/*.sh
      - name: Copies of skills stay exact
        run: scripts/check-repeats.sh
